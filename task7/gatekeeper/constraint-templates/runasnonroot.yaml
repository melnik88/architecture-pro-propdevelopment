apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8spsprequiredsecuritycontext
  annotations:
    description: >-
      Требует обязательные настройки securityContext:
      - runAsNonRoot: true (запрет запуска от root)
      - readOnlyRootFilesystem: true (только чтение корневой ФС)
      - allowPrivilegeEscalation: false (запрет повышения привилегий)
spec:
  crd:
    spec:
      names:
        kind: K8sPSPRequiredSecurityContext
      validation:
        openAPIV3Schema:
          type: object
          description: Требует обязательные настройки безопасности контейнеров
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8spsprequiredsecuritycontext

        # Проверка runAsNonRoot
        violation[{"msg": msg}] {
          c := input_containers[_]
          not input_runAsNonRoot(c)
          msg := sprintf("Контейнер %v должен иметь runAsNonRoot: true", [c.name])
        }

        # Проверка readOnlyRootFilesystem
        violation[{"msg": msg}] {
          c := input_containers[_]
          not input_readOnlyRootFilesystem(c)
          msg := sprintf("Контейнер %v должен иметь readOnlyRootFilesystem: true", [c.name])
        }

        # Проверка allowPrivilegeEscalation
        violation[{"msg": msg}] {
          c := input_containers[_]
          not input_allowPrivilegeEscalation(c)
          msg := sprintf("Контейнер %v должен иметь allowPrivilegeEscalation: false", [c.name])
        }

        # Проверка что не запускается от root (UID 0)
        violation[{"msg": msg}] {
          c := input_containers[_]
          input_runAsUser_zero(c)
          msg := sprintf("Контейнер %v не должен запускаться от UID 0 (root)", [c.name])
        }

        input_runAsNonRoot(c) {
          c.securityContext.runAsNonRoot == true
        }

        input_runAsNonRoot(c) {
          input.review.object.spec.securityContext.runAsNonRoot == true
        }

        input_readOnlyRootFilesystem(c) {
          c.securityContext.readOnlyRootFilesystem == true
        }

        input_allowPrivilegeEscalation(c) {
          c.securityContext.allowPrivilegeEscalation == false
        }

        input_runAsUser_zero(c) {
          c.securityContext.runAsUser == 0
        }

        input_runAsUser_zero(c) {
          not has_field(c.securityContext, "runAsUser")
          input.review.object.spec.securityContext.runAsUser == 0
        }

        input_containers[c] {
          c := input.review.object.spec.containers[_]
        }

        input_containers[c] {
          c := input.review.object.spec.initContainers[_]
        }

        input_containers[c] {
          c := input.review.object.spec.ephemeralContainers[_]
        }

        has_field(obj, field) {
          obj[field]
        }
