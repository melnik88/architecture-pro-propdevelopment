apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-admins
  labels:
    rbac.propdevelopment.com/binding: cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
# Администраторы инфраструктуры
- kind: User
  name: admin-devops
  apiGroup: rbac.authorization.k8s.io
- kind: User
  name: admin-infra
  apiGroup: rbac.authorization.k8s.io
# Группа администраторов
- kind: Group
  name: system:masters
  apiGroup: rbac.authorization.k8s.io
